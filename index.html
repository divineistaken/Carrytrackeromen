<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrytrackeromen</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #f0883e;
    --green: #3fb950;
    --red: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #1b2330 0%, var(--bg) 55%);
    color: var(--text);
    font: 15px/1.5 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    padding: 32px 16px 64px;
  }
  main { max-width: 860px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -0.5px; }
  h1 span { color: var(--accent); }
  .wip {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--muted); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 9px;
  }
  .sub { color: var(--muted); margin: 6px 0 24px; font-size: 13px; }
  .sub a { color: var(--muted); }
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px; margin-bottom: 24px;
  }
  .stat {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
  }
  .stat b { display: block; font-size: 20px; color: var(--text); }
  .stat span { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; margin-bottom: 24px;
  }
  .panel h2 {
    margin: 0; padding: 12px 16px; font-size: 13px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .panel-head {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
  }
  .panel-head h2 { padding: 0; border-bottom: 0; }
  .range { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .range label {
    display: flex; align-items: center; gap: 6px; font-size: 10px;
    text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
  }
  .range input {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 12px;
    color-scheme: dark;
  }
  .range button {
    background: #21262d; border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .range button:hover { border-color: var(--accent); color: var(--accent); }
  .range-note { margin: 0; padding: 8px 16px; font-size: 12px; color: var(--muted); border-bottom: 1px solid #21262d; }
  .range-note:empty { display: none; }
  .name { font-weight: 600; }
  th.num, td.num { text-align: right; white-space: nowrap; }
  td.num.total { color: var(--accent); font-weight: 700; }
  th.num.total { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 16px; border-bottom: 1px solid #21262d; }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  tr:last-child td { border-bottom: 0; }
  td.carry { color: var(--accent); font-weight: 600; }
  .uname { color: var(--muted); font-weight: 400; }
  .empty { padding: 28px 16px; color: var(--muted); text-align: center; }
  footer { color: var(--muted); font-size: 12px; display: flex; gap: 16px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: 1px; }
  .dot.stale { background: var(--red); }
  .error { color: var(--red); }
</style>
</head>
<body>
<main>
  <header>
    <h1>OMEN <span>Carries</span></h1>
    <span class="wip">work in progress</span>
  </header>
  <p class="sub">
    tracking <a href="https://territorial.io/log/team" target="_blank" rel="noopener">territorial.io/log/team</a>
    &middot; wins by clan <b>[OMEN]</b> only
  </p>

  <section class="stats">
    <div class="stat"><b id="total-wins">-</b><span>OMEN wins tracked</span></div>
    <div class="stat"><b id="total-carriers">-</b><span>players with carries</span></div>
    <div class="stat"><b id="updated">-</b><span>last checked (UTC)</span></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Carries</h2>
      <div class="range">
        <label>From <input type="datetime-local" id="from" step="1"></label>
        <label>To <input type="datetime-local" id="to" step="1"></label>
        <button id="apply" type="button">Apply</button>
        <button id="clear" type="button">All time</button>
      </div>
    </div>
    <p class="range-note" id="range-note"></p>
    <table class="carries">
      <thead>
        <tr>
          <th>Player</th>
          <th class="num">Non-contest</th>
          <th class="num">Contest</th>
          <th class="num total">Total</th>
        </tr>
      </thead>
      <tbody id="carries">
        <tr><td colspan="4" class="empty">loading...</td></tr>
      </tbody>
    </table>
  </section>

  <section class="panel">
    <h2>Recent OMEN wins</h2>
    <table>
      <thead>
        <tr><th>Time (UTC)</th><th>Map</th><th>Carry</th></tr>
      </thead>
      <tbody id="wins">
        <tr><td colspan="3" class="empty">loading...</td></tr>
      </tbody>
    </table>
  </section>

  <footer>
    <span><span class="dot" id="dot"></span><span id="status">connecting...</span></span>
    <span>auto-refresh every 30s</span>
  </footer>
</main>

<script>
const SLOT_MS = 30000;
const SLOT_BASE = "https://raw.githubusercontent.com/divineistaken/Carrytrackeromen/data/d/";
const STATE_SOURCES = [
  "https://raw.githack.com/divineistaken/Carrytrackeromen/data/state.json",
  "https://raw.githubusercontent.com/divineistaken/Carrytrackeromen/data/state.json"
];
const HISTORY_SOURCES = [
  "https://raw.githack.com/divineistaken/Carrytrackeromen/data/history.json",
  "https://raw.githubusercontent.com/divineistaken/Carrytrackeromen/data/history.json"
];
const REFRESH_MS = 30000;
const MAX_ROWS = 25;

const $ = (id) => document.getElementById(id);
let lastData = null;
let history = null;
let historyAt = 0;
let activeRange = null;

async function getJson(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error(url + " -> " + res.status);
  const data = await res.json();
  if (!data || !Array.isArray(data.wins)) throw new Error("bad payload");
  return data;
}

function slotUrls() {
  const now = Date.now();
  const newest = Math.floor(now / SLOT_MS) * SLOT_MS;
  const urls = [];
  for (let i = 0; i < 4; i++) {
    urls.push(SLOT_BASE + (newest - i * SLOT_MS) + ".json");
  }
  return urls;
}

async function loadData() {
  const slots = await Promise.allSettled(slotUrls().map(getJson));
  const valid = slots
    .filter((r) => r.status === "fulfilled")
    .map((r) => r.value)
    .sort((a, b) => {
      const wa = a.total_wins || 0, wb = b.total_wins || 0;
      if (wb !== wa) return wb - wa;
      return (Date.parse((b.checked || "").replace(" UTC", "Z")) || 0)
           - (Date.parse((a.checked || "").replace(" UTC", "Z")) || 0);
    });
  if (valid.length) return valid[0];

  const states = await Promise.allSettled(STATE_SOURCES.map(getJson));
  const fallback = states.find((r) => r.status === "fulfilled");
  if (fallback) return fallback.value;
  throw new Error("all sources failed");
}

function carryStats(data) {
  if (data.carries_noncontest || data.carries_contest) {
    return {
      total: data.carries || {},
      non: data.carries_noncontest || {},
      con: data.carries_contest || {},
    };
  }
  const wins = data.wins || [];
  if (wins.length && wins.length >= (data.total_wins || 0)) {
    const total = {}, non = {}, con = {};
    for (const w of wins) {
      const name = w.carry;
      if (!name) continue;
      total[name] = (total[name] || 0) + 1;
      if (w.contest) con[name] = (con[name] || 0) + 1;
      else non[name] = (non[name] || 0) + 1;
    }
    return { total, non, con };
  }
  return { total: data.carries || {}, non: null, con: null };
}

async function loadHistory(force) {
  if (!force && history && Date.now() - historyAt < 60000) return history;
  const results = await Promise.allSettled(HISTORY_SOURCES.map(getJson));
  const ok = results.find((r) => r.status === "fulfilled");
  if (ok) {
    history = ok.value;
    historyAt = Date.now();
  }
  return history;
}

function mergedWins(data) {
  const map = new Map();
  for (const w of (history && history.wins) || []) map.set(w.time + "|" + w.map, w);
  for (const w of data.wins || []) map.set(w.time + "|" + w.map, w);
  return [...map.values()].sort((a, b) =>
    (Date.parse(b.time) || 0) - (Date.parse(a.time) || 0));
}

function inRange(w) {
  if (!activeRange) return true;
  const t = Date.parse(w.time);
  if (isNaN(t)) return false;
  if (activeRange.from !== null && t < activeRange.from) return false;
  if (activeRange.to !== null && t > activeRange.to) return false;
  return true;
}

function filteredWins(data) {
  return mergedWins(data).filter(inRange);
}

function statsForRange(data) {
  const total = {}, non = {}, con = {};
  for (const w of filteredWins(data)) {
    const name = w.carry;
    if (!name) continue;
    total[name] = (total[name] || 0) + 1;
    if (w.contest) con[name] = (con[name] || 0) + 1;
    else non[name] = (non[name] || 0) + 1;
  }
  return { total, non, con };
}

function rangeText() {
  if (!activeRange) return "";
  const fmt = (t) => (t === null ? "…" : new Date(t).toLocaleString());
  return `${fmt(activeRange.from)} → ${fmt(activeRange.to)}`;
}

function playerLabel(data, code) {
  const display = (data.names || {})[code];
  const suffix = display && display !== code
    ? ` <span class="uname">(${escapeHtml(display)})</span>`
    : "";
  return escapeHtml(code) + suffix;
}

function render(data) {
  lastData = data;

  $("total-wins").textContent = data.total_wins ?? 0;
  const stats = activeRange ? statsForRange(data) : carryStats(data);
  const names = Object.keys(stats.total).sort((a, b) =>
    (stats.total[b] - stats.total[a]) || a.toLowerCase().localeCompare(b.toLowerCase()));
  $("total-carriers").textContent = names.length;
  $("updated").textContent = data.checked || data.updated || "-";

  const note = $("range-note");
  if (activeRange) {
    const n = filteredWins(data).length;
    note.textContent = `${n} win${n === 1 ? "" : "s"} · ${rangeText()}`;
  } else {
    note.textContent = "";
  }

  const list = $("carries");
  if (!names.length) {
    list.innerHTML = '<tr><td colspan="4" class="empty">no OMEN carries in this range</td></tr>';
  } else {
    list.innerHTML = names.map((name) => `
      <tr>
        <td class="name">${playerLabel(data, name)}</td>
        <td class="num">${stats.non ? (stats.non[name] || 0) : "—"}</td>
        <td class="num">${stats.con ? (stats.con[name] || 0) : "—"}</td>
        <td class="num total">${stats.total[name] || 0}</td>
      </tr>`).join("");
  }

  const wins = (activeRange ? filteredWins(data) : (data.wins || [])).slice(0, MAX_ROWS);
  const tbody = $("wins");
  if (!wins.length) {
    tbody.innerHTML = '<tr><td colspan="3" class="empty">no OMEN wins tracked yet</td></tr>';
  } else {
    tbody.innerHTML = wins.map((w) => `
      <tr>
        <td>${escapeHtml(w.time)}</td>
        <td>${escapeHtml(w.map)}</td>
        <td class="carry">${playerLabel(data, w.carry)}</td>
      </tr>`).join("");
  }

  setStatus("live", false);
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function setStatus(text, stale) {
  $("status").textContent = text;
  $("dot").className = "dot" + (stale ? " stale" : "");
}

async function applyRange() {
  const f = $("from").value;
  const t = $("to").value;
  if (!f && !t) {
    activeRange = null;
    if (lastData) render(lastData);
    return;
  }
  let from = f ? new Date(f).getTime() : null;
  let to = t ? new Date(t).getTime() : null;
  if (from !== null && isNaN(from)) from = null;
  if (to !== null && isNaN(to)) to = null;
  if (from !== null && to !== null && from > to) [from, to] = [to, from];
  activeRange = { from, to };
  try {
    await loadHistory(true);
  } catch (err) {
    console.error(err);
  }
  if (lastData) render(lastData);
}

function clearRange() {
  $("from").value = "";
  $("to").value = "";
  activeRange = null;
  if (lastData) render(lastData);
}

async function refresh() {
  try {
    if (activeRange) {
      try {
        await loadHistory(false);
      } catch (err) {
        console.error(err);
      }
    }
    render(await loadData());
  } catch (err) {
    console.error(err);
    if (!lastData) {
      $("carries").innerHTML = '<tr><td colspan="4" class="empty error">could not load data</td></tr>';
    }
    setStatus("offline - retrying", true);
  }
}

$("apply").addEventListener("click", applyRange);
$("clear").addEventListener("click", clearRange);
[$("from"), $("to")].forEach((el) => el.addEventListener("keydown", (e) => {
  if (e.key === "Enter") applyRange();
}));

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
