name: Track OMEN carries

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: omen-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect OMEN wins
        env:
          TTIO_ACCOUNT: ${{ secrets.TTIO_ACCOUNT }}
          TTIO_PASSWORD: ${{ secrets.TTIO_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          git config --global user.name "omen-tracker"
          git config --global user.email "omen-tracker@users.noreply.github.com"

          work="$(mktemp -d)"
          git fetch --depth=1 origin data
          git worktree add --detach "$work" FETCH_HEAD
          cd "$work"
          git checkout -B data

          state="$work/state.json"
          slots="$work/d"
          mkdir -p "$slots"

          start=$(date +%s)
          deadline=$(( start + 20700 ))
          dispatch_at=$(( start + 18000 ))
          dispatched=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            python3 "$GITHUB_WORKSPACE/tracker.py" "$state" "$slots" || true

            (
              cd "$slots"
              ls -1 *.json 2>/dev/null | sort -n | head -n -20 | xargs -r rm -f
            )

            if [ -n "$(git status --porcelain -- state.json history.json names.json d)" ]; then
              git add state.json history.json names.json d
              git commit --amend --no-edit -q || git commit -m "Update OMEN carry data" -q
              for attempt in 1 2 3; do
                if git push --force origin HEAD:data; then break; fi
                sleep 5
              done
            fi

            if [ "$dispatched" -eq 0 ] && [ "$(date +%s)" -ge "$dispatch_at" ]; then
              if gh workflow run track.yml -R "$GITHUB_REPOSITORY" --ref main; then
                dispatched=1
              fi
            fi

            sleep 25
          done

          if [ "$dispatched" -eq 0 ]; then
            gh workflow run track.yml -R "$GITHUB_REPOSITORY" --ref main || true
          fi
